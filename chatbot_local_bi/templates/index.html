<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot BI Local</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <div class="chat-header">
            <h2>Chatbot BI</h2>
            <p>Statut : <span id="status">Prêt</span></p>
        </div>
        <div id="chat-window" class="chat-window">
            <!-- Les messages apparaîtront ici -->
        </div>
        <div class="chat-input-area">
            <div class="upload-section">
                <input type="file" id="file-input" style="display: none;">
                <button id="upload-button">Téléverser un fichier</button>
                <span id="file-name">Aucun fichier</span>
            </div>
            <div class="message-section">
                <input type="text" id="message-input" placeholder="Posez votre question ici...">
                <button id="send-button">Envoyer</button>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
